function interpolate(evTable, g) {
  if (!evTable.length) return null;
  const exact = evTable.find(r => r.g === g);
  if (exact) return exact.ev56;
  if (g < evTable[0].g) return evTable[0].ev56;
  if (g > evTable[evTable.length - 1].g) return evTable[evTable.length - 1].ev56;
  let lo = evTable[0], hi = evTable[evTable.length - 1];
  for (let i = 0; i < evTable.length - 1; i++) {
    if (evTable[i].g <= g && evTable[i + 1].g >= g) {
      lo = evTable[i]; hi = evTable[i + 1]; break;
    }
  }
  if (lo.g === hi.g) return lo.ev56;
  const t = (g - lo.g) / (hi.g - lo.g);
  return Math.round(lo.ev56 + t * (hi.ev56 - lo.ev56));
}

// 狙い目の終端G数を計算
// ゾーン系はゾーン番号+35G、天井系はceilingを使用
function computeTargetTo(target, machine) {
  const label = target.label || '';
  // "XXXGゾーン狙い" → ゾーン番号+35
  const zoneG = label.match(/(\d+)Gゾーン/);
  if (zoneG) return parseInt(zoneG[1]) + 35;
  // "朝一88G狙い" / "150G狙い" / "350G狙い" など → 番号+35
  const gNum = label.match(/(\d+)G狙い/);
  if (gNum) return parseInt(gNum[1]) + 35;
  // 番号なし "ゾーン狙い" → from+35
  if (label.includes('ゾーン')) return target.from + 35;
  // CZ天井系
  if ((label.includes('CZ') || label.includes('スルー')) && machine.cz_ceiling)
    return machine.cz_ceiling;
  // 天井・AT後・設定変更後・ST後・朝一 etc → AT天井
  return machine.ceiling || 9999;
}

// CZ専用テーブルがない機種向けの独自計算
// ATテーブルの末尾G数を基準に「残り天井距離」でマッピング
function czEvCustom(machine, czG) {
  const evTable = machine.evTable;
  if (!evTable || !evTable.length || !machine.cz_ceiling) return null;
  const maxAtG = evTable[evTable.length - 1].g;
  const atEquiv = maxAtG - machine.cz_ceiling + czG;
  return interpolate(evTable, atEquiv);
}

function formatEv(v) {
  if (v === null) return '-';
  const abs = Math.abs(v).toLocaleString('ja-JP');
  return v >= 0 ? `+${abs}円` : `-${abs}円`;
}

function StatusPill({ status }) {
  if (status === 'ok') return <span className="status-pill pill-ok">天井あり</span>;
  if (status === 'no_ceiling') return <span className="status-pill pill-nc">天井なし</span>;
  return <span className="status-pill pill-na">データなし</span>;
}

function MachineSearch({ value, onChange }) {
  const [query, setQuery] = React.useState('');
  const [open, setOpen] = React.useState(false);
  const [focusedIdx, setFocusedIdx] = React.useState(-1);
  const blurTimer = React.useRef(null);
  const selected = DEFAULT_MACHINES.find(m => m.id === value);
  const filtered = React.useMemo(() => {
    const q = query.trim();
    return q ? DEFAULT_MACHINES.filter(m => m.name.includes(q)) : DEFAULT_MACHINES;
  }, [query]);
  const handleFocus = () => {
    clearTimeout(blurTimer.current);
    setQuery('');
    setOpen(true);
    setFocusedIdx(-1);
  };
  const handleBlur = () => {
    blurTimer.current = setTimeout(() => { setOpen(false); setQuery(''); }, 200);
  };
  const handleChange = e => { setQuery(e.target.value); setOpen(true); setFocusedIdx(-1); };
  const handleSelect = m => {
    clearTimeout(blurTimer.current);
    onChange(m.id);
    setOpen(false);
    setQuery('');
    setFocusedIdx(-1);
  };
  const handleKeyDown = e => {
    if (!open) { if (e.key === 'Enter' || e.key === 'ArrowDown') setOpen(true); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); setFocusedIdx(i => Math.min(i + 1, filtered.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setFocusedIdx(i => Math.max(i - 1, 0)); }
    else if (e.key === 'Enter') { e.preventDefault(); if (focusedIdx >= 0 && filtered[focusedIdx]) handleSelect(filtered[focusedIdx]); }
    else if (e.key === 'Escape') { setOpen(false); setQuery(''); }
  };
  return (
    <div className="machine-search-wrap">
      <input
        type="text"
        className="machine-search-input"
        placeholder="機種名で検索..."
        value={open ? query : (selected ? selected.name : '')}
        onChange={handleChange}
        onFocus={handleFocus}
        onBlur={handleBlur}
        onKeyDown={handleKeyDown}
        autoComplete="off"
        spellCheck="false"
      />
      <span className="machine-search-arrow">▾</span>
      {open && (
        <div className="machine-dropdown">
          {filtered.length === 0 ? (
            <div className="machine-dropdown-item" style={{cursor:'default'}}>
              <div className="machine-dropdown-name" style={{color:'#666'}}>該当機種なし</div>
            </div>
          ) : filtered.map((m, i) => (
            <div
              key={m.id}
              className={`machine-dropdown-item${i === focusedIdx ? ' is-focused' : ''}`}
              onClick={() => handleSelect(m)}
              onMouseEnter={() => setFocusedIdx(i)}
            >
              <div className="machine-dropdown-name">{m.name}</div>
              <div className="machine-dropdown-sub">
                {m.ceiling ? `天井 ${m.ceiling}G` : m.status === 'no_ceiling' ? '天井なし' : 'データなし'}
                {m.cz_ceiling ? ` / CZ ${m.cz_ceiling}G` : ''}
                {m.targets && m.targets.length > 0 ? ' / 狙い目あり' : ''}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function CheckTab({ machine }) {
  const [g, setG] = React.useState('');
  const [shortMode, setShortMode] = React.useState(false);
  const [shortIdx, setShortIdx] = React.useState(0);

  const hasData = machine.status === 'ok' && machine.evTable.length > 0;
  const showInput = hasData;
  const maxG = hasData ? machine.evTable[machine.evTable.length - 1].g : 0;

  // 天井短縮
  const hasShort = !!(machine.ceilingShort && machine.ceilingShort.length > 0);
  const shortCond = (hasShort && shortMode) ? machine.ceilingShort[shortIdx] : null;
  const effectiveCeiling = shortCond ? shortCond.ceiling : (machine.ceiling || maxG);

  const gNum = parseInt(g, 10);
  const gEntered = g !== '' && !isNaN(gNum) && gNum >= 0;

  // EV計算: 短縮モード時は shortCond.evTableShort → machine.evTableShort → 差分補間 の順に使用
  let ev = null;
  if (hasData && gEntered) {
    if (shortCond) {
      const shortTable = shortCond.evTableShort || machine.evTableShort;
      if (shortTable && shortTable.length > 0) {
        ev = interpolate(shortTable, gNum);
      } else {
        ev = interpolate(machine.evTable, gNum) - interpolate(machine.evTable, shortCond.ceiling);
      }
    } else {
      ev = interpolate(machine.evTable, gNum);
    }
  }

  const isExact = hasData && machine.evTable.some(r => r.g === gNum);
  const evClass = ev === null ? '' : ev > 0 ? 'ev-pos' : ev < 0 ? 'ev-neg' : 'ev-zero';

  // 残りG数: 短縮モード時は shortCeiling - gNum
  const remainG = shortCond
    ? Math.max(0, shortCond.ceiling - gNum)
    : (hasData ? maxG - gNum : 0);

  return (
    <div>
      <div className="machine-info">
        <div className="machine-name">
          {machine.name}
          <StatusPill status={machine.status} />
          {machine.ceiling && <span className="ceiling-badge">天井 {machine.ceiling}G</span>}
          {machine.cz_ceiling && <span className="cz-badge">CZ {machine.cz_ceiling}G</span>}
        </div>
        {machine.ceiling_note && <div className="ceiling-note">⚠ {machine.ceiling_note}</div>}
      </div>

      {!showInput ? (
        <p className="no-data">
          {machine.status === 'no_ceiling' ? 'この機種は天井なし（ジャグラー系等）のため期待値データはありません。' :
           machine.status === 'not_found' ? 'なな徹にデータが見つかりませんでした。' :
           '期待値テーブルが取得できませんでした。'}
        </p>
      ) : (
        <>
          {hasShort && (
            <div className="short-toggle-row">
              <button
                className={`short-btn${!shortMode ? ' active' : ''}`}
                onClick={() => { setShortMode(false); setShortIdx(0); }}
              >通常</button>
              <button
                className={`short-btn${shortMode ? ' active' : ''}`}
                onClick={() => setShortMode(true)}
              >短縮</button>
              {shortMode && (
                <select
                  className="short-select"
                  value={shortIdx}
                  onChange={e => setShortIdx(parseInt(e.target.value, 10))}
                >
                  {machine.ceilingShort.map((c, i) => (
                    <option key={i} value={i}>{c.label}（{c.ceiling}G）</option>
                  ))}
                </select>
              )}
            </div>
          )}

          <div className="g-row">
            <label>打ち出しG数</label>
            <input
              type="number"
              min="0"
              max={effectiveCeiling || undefined}
              value={g}
              onChange={e => setG(e.target.value)}
              placeholder="例: 700"
            />
            {hasData && <span style={{fontSize:'0.82rem',color:'#666'}}>（0 〜 {effectiveCeiling}G）</span>}
          </div>

          {hasData && gEntered && (
            <div className="result-box" style={{marginBottom:14}}>
              <div className="result-label">
                {shortCond
                  ? `${gNum}G〜${shortCond.ceiling}G（短縮天井）の期待値（5.6枚交換）`
                  : `${gNum}G〜天井の期待値（5.6枚交換）`}
              </div>
              <div style={{display:'grid',gridTemplateColumns:'5em 1fr',gap:'8px 16px',alignItems:'baseline',marginTop:8}}>
                <span style={{color:'#888',fontSize:'0.82rem',textAlign:'right'}}>期待値</span>
                <span className={`result-value ${evClass}`}>{formatEv(ev)}</span>
                {remainG > 0 && (() => {
                  const totalMin = Math.round(remainG / 800 * 60);
                  const timeStr = totalMin >= 60
                    ? `約${Math.floor(totalMin / 60)}時間${totalMin % 60 > 0 ? (totalMin % 60) + '分' : ''}`
                    : `約${totalMin}分`;
                  return (
                    <React.Fragment>
                      <span style={{color:'#888',fontSize:'0.82rem',textAlign:'right'}}>残り時間</span>
                      <span style={{color:'#aaa',fontSize:'0.88rem'}}>{timeStr}<span style={{color:'#666',fontSize:'0.80rem',marginLeft:6}}>（残り{remainG}G）</span></span>
                    </React.Fragment>
                  );
                })()}
              </div>
              {!isExact && <div className="interp-note" style={{marginTop:8}}>※ テーブル値から線形補間</div>}
            </div>
          )}
        </>
      )}
    </div>
  );
}

  if (!hasData) {

          <div className="machine-name">
            {machine.name}
            <StatusPill status={machine.status} />
          </div>
        </div>
        <p className="no-data">
          {machine.status === 'no_ceiling' ? 'この機種は天井なし（ジャグラー系等）のため期待値データはありません。' :
           machine.status === 'not_found' ? 'なな徹にデータが見つかりませんでした。' :
           '期待値テーブルが取得できませんでした。'}
        </p>
      </div>
    );
  }

  // 表示するテーブルを決定
  const hasShort = machine.ceilingShort && machine.ceilingShort.length > 0 
                   && machine.ceilingShort[0].evTableShort;
  
  const currentTable = tableMode === 'normal' ? machine.evTable 
                       : machine.ceilingShort[0].evTableShort || machine.evTable;
  const currentCeiling = tableMode === 'normal' ? machine.ceiling
                         : machine.ceilingShort[0].ceiling;
  const tableLabel = tableMode === 'normal' ? '通常天井' : machine.ceilingShort[0].label;

  let prevAbove = false;
  const rows = currentTable.map((row, i) => {
    const above = row.ev56 >= 1500;
    const boundary = above && !prevAbove && i > 0;
    prevAbove = above;
    return { ...row, above, boundary };
  });

  const evClass = v => v > 0 ? 'ev-pos' : v < 0 ? 'ev-neg' : 'ev-zero';

  return (
    <div>
      <div className="machine-info">
        <div className="machine-name">
          {machine.name}
          <StatusPill status={machine.status} />
          {currentCeiling && <span className="ceiling-badge">天井 {currentCeiling}G</span>}
          {machine.cz_ceiling && <span className="cz-badge">CZ {machine.cz_ceiling}G</span>}
        </div>
        {machine.ceiling_note && <div className="ceiling-note">⚠ {machine.ceiling_note}</div>}
      </div>
      
      {hasShort && (
        <div style={{marginBottom: 12, display: 'flex', gap: 8, flexWrap: 'wrap'}}>
          <button 
            className={`btn-small ${tableMode === 'normal' ? 'active' : ''}`}
            onClick={() => setTableMode('normal')}
            style={{padding: '6px 12px', fontSize: '0.85rem', border: '1px solid #666', borderRadius: 4, cursor: 'pointer', background: tableMode === 'normal' ? '#f0c060' : '#333', color: tableMode === 'normal' ? '#000' : '#ccc'}}
          >
            通常天井 {machine.ceiling}G
          </button>
          {machine.ceilingShort.map((cs, i) => {
            const modeKey = 'short-' + i;
            const isActive = tableMode === modeKey;
            return (
              <button
                key={i}
                className={'btn-small ' + (isActive ? 'active' : '')}
                onClick={() => setTableMode(modeKey)}
                style={{padding: '6px 12px', fontSize: '0.85rem', border: '1px solid #666', borderRadius: 4, cursor: 'pointer', background: isActive ? '#f0c060' : '#333', color: isActive ? '#000' : '#ccc'}}
              >
                {cs.label} {cs.ceiling}G
              </button>
            );
          })}
        </div>
      )}
      
      <table>
        <thead>
          <tr>
            <th>打ち出しG数</th>
            <th>期待値（5.6枚交換）</th>
          </tr>
        </thead>
        <tbody>
          {rows.map(row => (
            <tr
              key={row.g}
              className={[row.above ? 'highlight' : '', row.boundary ? 'hl-boundary' : ''].filter(Boolean).join(' ')}
            >
              <td>{row.g}G〜</td>
              <td className={evClass(row.ev56)}>{formatEv(row.ev56)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}
function CzZoneTab({ machine }) {
  const [czG, setCzG] = React.useState('');
  const [isReset, setIsReset] = React.useState(false);
  const [g, setG] = React.useState('');

  const hasCz = !!(machine.cz_ceiling);
  const hasTargets = !!(machine.targets && machine.targets.length > 0);
  const hasResetTable = !!(machine.czEvTableReset);
  const activeReset = isReset && hasResetTable;
  const activeTable = activeReset ? machine.czEvTableReset : (machine.czEvTable || null);
  const isCustom = hasCz && !activeTable;
  const maxCzG = machine.cz_ceiling;
  const czGNum = parseInt(czG, 10);

  let czEv = null;
  if (hasCz && czG !== '' && !isNaN(czGNum) && czGNum >= 0) {
    czEv = activeTable ? interpolate(activeTable, czGNum) : czEvCustom(machine, czGNum);
  }
  const czEvClass = czEv === null ? '' : czEv > 0 ? 'ev-pos' : czEv < 0 ? 'ev-neg' : 'ev-zero';
  const evRowClass = v => v > 0 ? 'ev-pos' : v < 0 ? 'ev-neg' : 'ev-zero';

  let czDisplayRows = null;
  if (hasCz) {
    if (activeTable) {
      let prevAbove = false;
      czDisplayRows = activeTable.map((row, i) => {
        const above = row.ev56 >= 1500;
        const boundary = above && !prevAbove && i > 0;
        prevAbove = above;
        return { ...row, above, boundary };
      });
    } else if (machine.evTable && machine.evTable.length && machine.cz_ceiling) {
      const maxAtG = machine.evTable[machine.evTable.length - 1].g;
      const raw = [];
      for (let cg = 0; cg <= machine.cz_ceiling; cg += 50) {
        const ev56 = interpolate(machine.evTable, maxAtG - machine.cz_ceiling + cg);
        if (ev56 !== null) raw.push({ g: cg, ev56 });
      }
      if (machine.cz_ceiling % 50 !== 0) {
        const ev56 = interpolate(machine.evTable, maxAtG);
        if (ev56 !== null) raw.push({ g: machine.cz_ceiling, ev56 });
      }
      let prevAbove = false;
      czDisplayRows = raw.map((row, i) => {
        const above = row.ev56 >= 1500;
        const boundary = above && !prevAbove && i > 0;
        prevAbove = above;
        return { ...row, above, boundary };
      });
    }
  }

  const gNum = parseInt(g, 10);
  const gEntered = g !== '' && !isNaN(gNum) && gNum >= 0;

  if (!hasCz && !hasTargets) {
    return (
      <div>
        <div className="machine-info">
          <div className="machine-name">
            {machine.name}
            <StatusPill status={machine.status} />
          </div>
        </div>
        <p className="no-data">この機種はCZデータ・狙い目情報がありません。</p>
      </div>
    );
  }

  return (
    <div>
      <div className="machine-info">
        <div className="machine-name">
          {machine.name}
          <StatusPill status={machine.status} />
          {machine.ceiling && <span className="ceiling-badge">天井 {machine.ceiling}G</span>}
          {hasCz && <span className="cz-badge">CZ {machine.cz_ceiling}G</span>}
        </div>
        {machine.ceiling_note && <div className="ceiling-note">⚠ {machine.ceiling_note}</div>}
        {hasCz && (
          <div style={{marginTop:6,fontSize:'0.78rem',color: machine.czEvTable ? '#4a8' : '#555'}}>
            {machine.czEvTable ? '✓ CZ専用テーブルあり' : '⚠ CZ専用テーブルなし（独自計算モード）'}
          </div>
        )}
      </div>

      {hasCz && (
        <>
          <div className="g-row" style={{marginBottom:12}}>
            <label>朝一（設定変更）</label>
            <label className={`toggle-switch${!hasResetTable ? ' toggle-disabled' : ''}`}>
              <input type="checkbox" checked={activeReset} onChange={e => setIsReset(e.target.checked)} disabled={!hasResetTable} />
              <span className="toggle-slider"></span>
            </label>
            <span style={{fontSize:'0.78rem',color: hasResetTable ? (activeReset ? '#80b0e0' : '#aaa') : '#555'}}>
              {hasResetTable ? (activeReset ? 'リセット後（設定変更）' : '通常条件') : 'リセットデータなし'}
            </span>
          </div>

          <div className="g-row">
            <label>CZ間G数</label>
            <input
              type="number"
              min="0"
              max={maxCzG}
              value={czG}
              onChange={e => setCzG(e.target.value)}
              placeholder="例: 300"
            />
            <span style={{fontSize:'0.82rem',color:'#666'}}>（0 〜 {maxCzG}G）</span>
          </div>

          {czG !== '' && !isNaN(czGNum) && czGNum >= 0 && (
            <div className="result-box" style={{marginBottom:20}}>
              <div className="result-label">
                CZ {czGNum}G〜天井の期待値（5.6枚交換）
                <span style={{marginLeft:10,fontSize:'0.85em',color:'#777'}}>残り {Math.max(0, maxCzG - czGNum)}G</span>
              </div>
              <div className={`result-value ${czEvClass}`}>{formatEv(czEv)}</div>
              {isCustom && <div className="interp-note">※ 独自計算（目安）— CZ専用テーブルなし、AT期待値テーブルから推算</div>}
              {!isCustom && activeTable && !activeTable.find(r => r.g === czGNum) && (
                <div className="interp-note">※ テーブル値から線形補間</div>
              )}
            </div>
          )}

          {czDisplayRows && czDisplayRows.length > 0 && (
            <>
              <div className="section-title" style={{marginTop:8,marginBottom:10}}>
                CZ間天井期待値表{isCustom ? '（独自計算・目安）' : ''}
              </div>
              <table>
                <thead>
                  <tr>
                    <th>CZ間G数</th>
                    <th>期待値（5.6枚交換）</th>
                  </tr>
                </thead>
                <tbody>
                  {czDisplayRows.map(row => (
                    <tr
                      key={row.g}
                      className={[row.above ? 'highlight' : '', row.boundary ? 'hl-boundary' : ''].filter(Boolean).join(' ')}
                    >
                      <td>{row.g}G〜</td>
                      <td className={evRowClass(row.ev56)}>{formatEv(row.ev56)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </>
          )}
        </>
      )}

      {hasTargets && (
        <div className="target-list" style={{marginTop: hasCz ? 8 : 0}}>
          {hasCz && <div style={{borderTop:'1px solid #2a2a38',marginBottom:16,marginTop:20}}></div>}
          <div className="section-title" style={{marginBottom:8}}>
            狙い目（たられば）
            {machine.noteUrl && (
              <a href={machine.noteUrl} target="_blank" rel="noopener noreferrer"
                 style={{marginLeft:10,fontSize:'0.78rem',color:'#80b0e0',textDecoration:'none'}}>
                ▶ 記事を開く
              </a>
            )}
          </div>
          <div className="g-row" style={{marginBottom:12}}>
            <label>現在G数</label>
            <input
              type="number"
              min="0"
              value={g}
              onChange={e => setG(e.target.value)}
              placeholder="例: 500"
            />
            <span style={{fontSize:'0.82rem',color:'#666'}}>（入力で狙い目判定）</span>
          </div>
          {machine.targets.map((t, i) => {
            const to = computeTargetTo(t, machine);
            let trClass = '';
            let statusText = null;
            let statusGray = false;
            if (gEntered) {
              if (gNum > to)          { trClass = 'tr-passed'; statusText = '通過済み'; statusGray = true; }
              else if (gNum >= t.from){ trClass = 'tr-active';  statusText = '★ 狙い目中'; }
              else                    { statusText = `あと ${t.from - gNum}G`; statusGray = true; }
            }
            return (
              <div key={i} className={`target-row ${trClass}`}>
                <div className="target-row-label">{t.label || '天井狙い'}</div>
                <div className="target-row-range">{t.from}G〜{to < 9999 ? to + 'G' : ''}</div>
                {statusText && (
                  <div className={`target-row-status${statusGray ? ' ts-gray' : ''}`}>{statusText}</div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function App() {
  const [tab, setTab] = React.useState('check');
  const [machineId, setMachineId] = React.useState(DEFAULT_MACHINES[0].id);

  const machine = DEFAULT_MACHINES.find(m => m.id === machineId) || DEFAULT_MACHINES[0];

  const okMachines = DEFAULT_MACHINES.filter(m => m.status === 'ok');
  const otherMachines = DEFAULT_MACHINES.filter(m => m.status !== 'ok');

  return (
    <div>
      <h1>HYENA 期待値ツール</h1>

      {tab !== 'list' && (
        <div className="card" style={{marginBottom: 20}}>
          <div className="section-title" style={{marginBottom:8}}>機種を選択</div>
          <MachineSearch value={machineId} onChange={setMachineId} />
        </div>
      )}

      <div className="tab-bar">
        <div className={`tab ${tab === 'check' ? 'active' : ''}`} onClick={() => setTab('check')}>天井狙い</div>
        <div className={`tab ${tab === 'cz' ? 'active' : ''}`} onClick={() => setTab('cz')}>CZ・ゾーン狙い</div>
        <div className={`tab ${tab === 'table' ? 'active' : ''}`} onClick={() => setTab('table')}>期待値表</div>
        <div className={`tab ${tab === 'list' ? 'active' : ''}`} onClick={() => setTab('list')}>機種一覧</div>
      </div>

      <div className="card">
        {tab === 'check' && <CheckTab key={machine.id} machine={machine} />}
        {tab === 'cz' && <CzZoneTab key={machine.id} machine={machine} />}
        {tab === 'table' && <TableTab machine={machine} />}
        {tab === 'list' && (
          <div>
            <div className="section-title" style={{marginBottom:8}}>天井あり機種（{okMachines.length}機種）</div>
            <div className="list-grid" style={{marginBottom:20}}>
              {okMachines.map(m => (
                <div
                  key={m.id}
                  className="list-item"
                  style={{cursor:'pointer'}}
                  onClick={() => { setMachineId(m.id); setTab('check'); }}
                >
                  {m.name}<br/>
                  <span>
                    天井 {m.ceiling}G
                    {m.cz_ceiling && <span style={{color:'#80b0e0'}}>{' '}/ CZ {m.cz_ceiling}G</span>}
                    {' / '}{m.evTable.length}行
                  </span>
                  {m.ceiling_note && <span style={{display:'block',color:'#c8a030',fontSize:'0.73rem',marginTop:2}}>⚠ {m.ceiling_note}</span>}
                  {m.targets && m.targets.length > 0 && (
                    <span className="target-tag">
                      狙い目: {m.targets.map(t => `${t.label ? t.label + ' ' : ''}${t.from}G〜`).join(' / ')}
                    </span>
                  )}
                </div>
              ))}
            </div>
            <div className="section-title" style={{marginBottom:8}}>天井なし / データなし（{otherMachines.length}機種）</div>
            <div className="list-grid">
              {otherMachines.map(m => (
                <div
                  key={m.id}
                  className="list-item"
                  style={{opacity: m.targets && m.targets.length > 0 ? 0.85 : 0.55, cursor: m.targets && m.targets.length > 0 ? 'default' : 'default'}}
                >
                  {m.name}<br/>
                  <span>{m.status === 'no_ceiling' ? '天井なし' : m.status === 'not_found' ? '未登録' : 'データなし'}</span>
                  {m.targets && m.targets.length > 0 && (
                    <span className="target-tag">
                      狙い目: {m.targets.map(t => `${t.label ? t.label + ' ' : ''}${t.from}G〜`).join(' / ')}
                    </span>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
